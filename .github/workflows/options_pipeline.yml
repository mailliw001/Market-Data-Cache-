# Save as .github/workflows/options_pipeline.yml in the (private) data repo.
# Put options_pipeline.py at scripts/options_pipeline.py in the same repo.
# Add a repository secret FRED_API_KEY (Settings > Secrets and variables > Actions) for the risk-free rate.
name: options-pipeline

on:
  schedule:
    - cron: "45 21 * * 1-5"      # 21:45 UTC weekdays = 17:45 ET (EDT) / 16:45 ET (EST): after the 16:15 ET options close, final quotes
  workflow_dispatch: {}           # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: options-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas pyarrow numpy scipy yfinance curl_cffi

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/options_pipeline.py

      - name: Commit data
        run: |
          git config user.name "options-cache-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/options_cache
          git diff --cached --quiet || git commit -m "options pipeline $(date -u +%F)"
          git pull --rebase
          git push
